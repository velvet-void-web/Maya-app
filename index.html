*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--c1:#ff2d78;--c2:#bf00ff;--c3:#ff6b00;--bg:#08000f;--card:rgba(255,255,255,0.05);--border:rgba(255,255,255,0.09);--text:#f0deff;--sub:rgba(255,255,255,0.4);}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);}
.blob{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;}

.b2{width:300px;height:300px;background:var(--c1);opacity:.10;bottom:-60px;right:-60px;animation:fl 11s ease-in-out infinite reverse;}
.b3{width:180px;height:180px;background:var(--c3);opacity:.07;top:45%;left:55%;animation:fl 7s ease-in-out infinite 2s;}

#app{position:relative;z-index:1;width:100%;max-width:420px;height:100vh;margin:0 auto;display:flex;flex-direction:column;}

.face-wrap{position:relative;flex-shrink:0;}
.face{width:48px;height:48px;border-radius:50%;box-shadow:0 0 0 2px var(--c2),0 0 20px rgba(191,0,255,.4);display:flex;align-items:center;justify-content:center;background:#1a0030;}

.online{position:absolute;bottom:1px;right:1px;width:10px;height:10px;border-radius:50%;background:#22c55e;border:2px solid var(--bg);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.ear-l,.ear-r{position:absolute;top:13px;width:7px;height:14px;border-radius:4px;background:linear-gradient(180deg,#ffb3c6,#ff69b4);transition:transform .3s;}
.ear-l{left:-4px;}.ear-r{right:-4px;}
.face-wrap.listening .ear-l{transform:scaleY(1.4) translateX(-2px);}
.face-wrap.listening .ear-r{transform:scaleY(1.4) translateX(2px);}
.hdr-info{flex:1;}

.vslot{flex:1;padding:7px 5px;border-radius:11px;border:1px solid var(--border);background:var(--card);cursor:pointer;text-align:center;transition:all .2s;position:relative;min-width:0;}

.vslot-sub{font-size:8.5px;color:var(--sub);margin-top:1px;}

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          // ── VOICE SLOTS ──
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          function renderSlots(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const el=document.getElementById('vslots'); el.innerHTML='';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              savedVoices.forEach((v,i)=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const s=document.createElement('div');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      s.className='vslot'+(v.id===selVoiceId?' active':'');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          s.innerHTML=`<div class="del" onclick="removeSlot(${i},event)">✕</div><div class="vslot-name">${v.name}</div><div class="vslot-sub">Slot ${i+1}</div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              s.onclick=()=>activateVoice(v.id,v.name);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  el.appendChild(s);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if(savedVoices.length<3){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const b=document.createElement('div');b.className='add-voice-btn';b.textContent='＋';b.onclick=openModal;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              el.appendChild(b);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function activateVoice(id,name){selVoiceId=id;selVoiceName=name;renderSlots();save();}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function removeSlot(i,e){e.stopPropagation();savedVoices.splice(i,1);renderSlots();save();}

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // ── VOICE MODAL ──
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function openModal(){document.getElementById('modalBg').classList.add('show');loadVoiceList();}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function closeModal(){document.getElementById('modalBg').classList.remove('show');}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('modalBg').addEventListener('click',e=>{if(e.target===document.getElementById('modalBg'))closeModal();});

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                async function loadVoiceList(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const list=document.getElementById('voiceList');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    list.innerHTML='<div class="loading-msg">🔍 Voices dhoondh rahi hoon...</div>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      try{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const res=await fetch('https://api.elevenlabs.io/v1/voices',{headers:{'xi-api-key':EL_KEY}});
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const voices=(await res.json()).voices||[];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const sorted=[
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ...voices.filter(v=>v.name.toLowerCase().includes('tara')),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ...voices.filter(v=>!v.name.toLowerCase().includes('tara')&&(['priya','simran','anushri','anika','nara','saira','muskaan'].some(n=>v.name.toLowerCase().includes(n))||v.labels?.language==='hi'||v.labels?.accent?.toLowerCase().includes('indian'))),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ...voices.filter(v=>v.labels?.gender==='female').slice(0,12)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ].filter((v,i,a)=>a.findIndex(x=>x.voice_id===v.voice_id)===i);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            list.innerHTML='';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                sorted.forEach(v=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const saved=savedVoices.some(s=>s.id===v.voice_id);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const d=document.createElement('div');d.className='voice-item';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  d.innerHTML=`<div class="vi-info"><div class="vi-name">${v.name}</div><div class="vi-desc">${v.description||'ElevenLabs voice'}</div></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="vi-actions">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button class="vi-btn use" onclick="useVoice('${v.voice_id}','${v.name.replace(/'/g,"\\'")}')">Use</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <button class="vi-btn save${saved?' saved':''}" onclick="saveVoice('${v.voice_id}','${v.name.replace(/'/g,"\\'")}',this)">${saved?'✓':'+ Save'}</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            list.appendChild(d);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if(!sorted.length)list.innerHTML='<div class="loading-msg">Koi voice nahi mili 😭</div>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }catch(e){list.innerHTML='<div class="loading-msg">❌ Error loading voices</div>';}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function useVoice(id,name){activateVoice(id,name);closeModal();addMsg('maya',`Ab meri awaaz ${name} jaisi hai!! 💅`);setTimeout(()=>speak('Ab meri awaaz sun!'),300);}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function saveVoice(id,name,btn){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(savedVoices.some(s=>s.id===id))return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if(savedVoices.length>=3){alert('3 se zyada nahi!');return;}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            savedVoices.push({id,name});btn.textContent='✓';btn.classList.add('saved');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              renderSlots();save();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
